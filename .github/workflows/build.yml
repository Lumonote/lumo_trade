name: Build Desktop App

# 跨平台桌面打包：macOS / Windows / Linux 三平台矩阵。
# 之前「只有 macOS 成功」的根因：Win/Linux 缺系统依赖（webkit2gtk 等）、
# 缺 Python/Node/Rust 统一安装、缺 KRONOS_BACKEND_BUNDLE_MODE 等编译期 env。
# 本工作流对每个平台独立 setup 并产出 Tauri 安装包。
#
# 交付方式（由 PACKAGE_KIND 区分）：
#   · 任意分支 push        → 三平台构建，产物名带 -test 后缀，Artifacts 保留 7 天（测试包）
#   · main 分支 push       → 同上但产物名带 -release 后缀，保留 14 天（正式包）
#   · push v* tag          → 正式包 + release job，把安装包附到 GitHub Release

on:
  push:
    # 所有分支都构建：main 出正式包，其余分支出测试包。
    branches: ["**"]
    tags: ["v*"]
  pull_request:
    branches: [V2.1.4]
  workflow_dispatch:

# 同一 ref 的新推送取消旧 run，省 CI 额度。
# ⚠️ workflow 级 concurrency 不支持 matrix 上下文（会报 Unrecognized named-value: 'matrix'），
# 所以只按 ref 分组；要按平台分别取消就得把这段挪进 build job 里。
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  # 3.11 has the broadest wheel coverage for PyInstaller + numeric/web deps.
  # The lite bundle does not need torch/modelscope, so keep CI on the stable lane.
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "22"
  RUST_TOOLCHAIN: stable
  # main.rs 用 env! 编译期捕获这两个值，必须和打包后端一致。
  KRONOS_BACKEND_BUNDLE_MODE: lite
  KRONOS_WEB_SERVER: robyn

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # 三平台并行；任一平台失败不取消其它。
        os: [macos-latest, windows-latest, ubuntu-latest]
        include:
          - os: macos-latest
            artifact-name: macOS
            artifact-glob: |
              src-tauri/target/release/bundle/dmg/*.dmg
              src-tauri/target/release/bundle/macos/*.app
          - os: windows-latest
            artifact-name: Windows
            artifact-glob: |
              src-tauri/target/release/bundle/nsis/*.exe
              src-tauri/target/release/bundle/msi/*.msi
          - os: ubuntu-latest
            artifact-name: Linux
            artifact-glob: |
              src-tauri/target/release/bundle/deb/*.deb
              src-tauri/target/release/bundle/appimage/*.AppImage
              src-tauri/target/release/bundle/rpm/*.rpm

    env:
      # 非 main、非 tag 的分支推送 = 测试包；main / v* tag = 正式包。
      # PR 事件 ref_name 是 "<n>/merge"，同样落进 test。
      PACKAGE_KIND: ${{ (github.ref_type == 'tag' || github.ref_name == 'main') && 'release' || 'test' }}
      ARTIFACT_RETENTION: ${{ (github.ref_type == 'tag' || github.ref_name == 'main') && '14' || '7' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      # Linux: Tauri 需要 webkit2gtk 等系统库。
      - name: Install Linux system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev \
            patchelf libssl-dev libgtk-3-dev libayatana-appindicator3-dev
        shell: bash

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          python - <<'PY'
          from pathlib import Path

          skip = ("torch", "modelscope", "huggingface_hub", "safetensors", "einops")
          out = []
          for line in Path("requirements.txt").read_text(encoding="utf-8").splitlines():
              stripped = line.strip()
              normalized = stripped.lower().replace("_", "-")
              if stripped and not stripped.startswith("#") and any(normalized.startswith(name.replace("_", "-")) for name in skip):
                  continue
              out.append(line)
          Path("build").mkdir(exist_ok=True)
          Path("build/requirements-ci-lite.txt").write_text("\n".join(out) + "\n", encoding="utf-8")
          PY
          pip install -r build/requirements-ci-lite.txt
          pip install pyinstaller
        shell: bash

      - name: Install npm deps
        run: npm ci

      # 源码保护：打包前压缩混淆前端静态资源（.js/.css）。
      - name: Minify frontend static assets
        run: bash packaging/scripts/minify_static.sh
        shell: bash

      # 构建内置后端（PyInstaller 单体，lite 模式不含 torch）。
      - name: Build bundled backend
        run: python packaging/scripts/build_backend.py --clean --mode lite
        shell: bash
        env:
          KRONOS_BACKEND_BUNDLE_MODE: lite
          KRONOS_WEB_SERVER: robyn

      # Tauri 桌面构建；main.rs 的 env! 读上面的 KRONOS_* 环境变量。
      - name: Build Tauri app
        run: npm run desktop:build
        shell: bash
        env:
          KRONOS_BACKEND_BUNDLE_MODE: lite
          KRONOS_WEB_SERVER: robyn
          # CI 环境无签名凭证，跳过 macOS 公证（仅打 ad-hoc 包）。
          APPLE_SIGNING_IDENTITY: ""

      - name: Collect artifacts
        if: always()
        run: |
          mkdir -p artifacts
          # 把 glob 命中的产物拷到 artifacts/ 顶层。
          bash -c 'cp -v ${{ matrix.artifact-glob }} artifacts/ 2>/dev/null || true'
          ls -la artifacts/ || true
        shell: bash

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Lumo-${{ matrix.artifact-name }}-${{ env.PACKAGE_KIND }}
          path: artifacts/*
          if-no-files-found: warn
          retention-days: ${{ env.ARTIFACT_RETENTION }}

  # 仅在 push v* tag 时运行：把三平台安装包附到 GitHub Release。
  # 测试包（非 main 分支）不会进入这里，只留在 Actions Artifacts。
  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Show collected files
        run: ls -la dist

      # 只附文件：.app 是目录（Release 不接受），其内容已包含在 .dmg 里。
      # fail_on_unmatched_files 保持默认 false —— 某个平台没产出该格式不应让发布失败。
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          draft: false
          prerelease: false
          files: |
            dist/*.dmg
            dist/*.exe
            dist/*.msi
            dist/*.deb
            dist/*.AppImage
            dist/*.rpm
