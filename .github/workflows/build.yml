name: Build Desktop App

# 跨平台桌面打包：macOS(arm64 + x64) / Windows 矩阵（Linux 因构建 exit 100 已临时下线）。
# 之前「只有 macOS 成功」的根因：Windows 缺 Python/Node/Rust 统一安装、
# 缺 KRONOS_BACKEND_BUNDLE_MODE 等编译期 env。
# 本工作流对每个平台独立 setup 并产出 Tauri 安装包。
#
# 交付方式（由 PACKAGE_KIND 区分）：
#   · 任意分支 push        → 三平台构建，产物名带 -test 后缀，Artifacts 保留 7 天（测试包）
#   · main 分支 push       → 同上但产物名带 -release 后缀，保留 14 天（正式包）
#   · push v* tag          → 正式包 + release job，把安装包附到 GitHub Release

on:
  push:
    # 所有分支都构建：main 出正式包，其余分支出测试包。
    branches: ["**"]
    tags: ["v*"]
  pull_request:
    branches: [V2.1.4]
  workflow_dispatch:

# 同一 ref 的新推送取消旧 run，省 CI 额度。
# ⚠️ workflow 级 concurrency 不支持 matrix 上下文（会报 Unrecognized named-value: 'matrix'），
# 所以只按 ref 分组；要按平台分别取消就得把这段挪进 build job 里。
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  # 3.11 has the broadest wheel coverage for PyInstaller + numeric/web deps.
  # The lite bundle does not need torch/modelscope, so keep CI on the stable lane.
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "22"
  RUST_TOOLCHAIN: stable
  # main.rs 用 env! 编译期捕获这两个值，必须和打包后端一致。
  KRONOS_BACKEND_BUNDLE_MODE: lite
  KRONOS_WEB_SERVER: robyn

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # 各平台并行；任一平台失败不取消其它。
        # macOS 两个芯片版本各出一个原生包：
        #   macos-latest   = Apple Silicon(arm64)
        #   macos-15-intel = Intel(x64)（macos-13 已退役，Intel 现用这个标签）
        # 恢复 Linux 时：把 ubuntu-latest 加回下面的 os 列表、补 include 条目，
        # 并把「Install Linux system deps」步骤一起加回来。
        os: [macos-latest, macos-15-intel, windows-latest]
        include:
          - os: macos-latest
            artifact-name: macOS-arm64
            tauri-build-cmd: npm run desktop:build
            artifact-glob: |
              src-tauri/target/release/bundle/dmg/*.dmg
              src-tauri/target/release/bundle/macos/*.app
          - os: macos-15-intel
            artifact-name: macOS-x64
            tauri-build-cmd: npm run desktop:build
            artifact-glob: |
              src-tauri/target/release/bundle/dmg/*.dmg
              src-tauri/target/release/bundle/macos/*.app
          # Windows 用 -vv 打开 tauri-bundler 的 debug 日志。
          # 原因：tauri-bundler 的 CommandExt::output_ok 在子进程失败时只报
          # "failed to run <程序>"，**丢弃 candle/light 的 stderr**。不加 -vv 就只能
          # 看到「light.exe 退出码 1」，看不到真正的 LGHT 错误码，无法定位。
          - os: windows-latest
            artifact-name: Windows
            tauri-build-cmd: npm run desktop:build -- -vv
            artifact-glob: |
              src-tauri/target/release/bundle/nsis/*.exe
              src-tauri/target/release/bundle/msi/*.msi

    env:
      # 非 main、非 tag 的分支推送 = 测试包；main / v* tag = 正式包。
      # PR 事件 ref_name 是 "<n>/merge"，同样落进 test。
      PACKAGE_KIND: ${{ (github.ref_type == 'tag' || github.ref_name == 'main') && 'release' || 'test' }}
      ARTIFACT_RETENTION: ${{ (github.ref_type == 'tag' || github.ref_name == 'main') && '14' || '7' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          python - <<'PY'
          from pathlib import Path

          skip = ("torch", "modelscope", "huggingface_hub", "safetensors", "einops")
          out = []
          for line in Path("requirements.txt").read_text(encoding="utf-8").splitlines():
              stripped = line.strip()
              normalized = stripped.lower().replace("_", "-")
              if stripped and not stripped.startswith("#") and any(normalized.startswith(name.replace("_", "-")) for name in skip):
                  continue
              out.append(line)
          Path("build").mkdir(exist_ok=True)
          Path("build/requirements-ci-lite.txt").write_text("\n".join(out) + "\n", encoding="utf-8")
          PY
          pip install -r build/requirements-ci-lite.txt
          pip install pyinstaller
        shell: bash

      - name: Install npm deps
        run: npm ci

      # 源码保护：打包前压缩混淆前端静态资源（.js/.css）。
      - name: Minify frontend static assets
        run: bash packaging/scripts/minify_static.sh
        shell: bash

      # 构建内置后端（PyInstaller 单体，lite 模式不含 torch）。
      - name: Build bundled backend
        run: python packaging/scripts/build_backend.py --clean --mode lite
        shell: bash
        env:
          KRONOS_BACKEND_BUNDLE_MODE: lite
          KRONOS_WEB_SERVER: robyn

      # WiX Toolset v3 的 light.exe 依赖 Windows 的 VBSCRIPT 可选功能，
      # 缺失时的报错正是「failed to run light.exe」（Tauri 官方文档明确记载）。
      # windows-latest 已迁移到 Windows Server 2025，VBSCRIPT 在 24H2/Server 2025 起
      # 变成「按需功能(Feature on Demand)」，镜像可能未预装，所以显式检查并补齐。
      # 仅 Windows 需要；VBSCRIPT 已是 Installed 时本步骤为空操作，不影响 macOS。
      - name: Ensure VBSCRIPT for WiX light.exe
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $cap = Get-WindowsCapability -Online -Name 'VBScript*' -ErrorAction SilentlyContinue |
                 Select-Object -First 1
          $state = if ($cap) { $cap.State } else { '<not found>' }
          Write-Host "VBScript capability state: $state"

          if ($state -ne 'Installed') {
            Write-Host 'VBScript missing -> installing optional feature ...'
            try {
              Add-WindowsCapability -Online -Name 'VBScript~~~~0.0.1.0' -ErrorAction Stop | Out-Null
              Write-Host 'Add-WindowsCapability succeeded.'
            } catch {
              Write-Warning "Add-WindowsCapability failed: $($_.Exception.Message)"
              Write-Host 'Retrying with DISM ...'
              dism.exe /Online /Add-Capability /CapabilityName:VBScript~~~~0.0.1.0 /Quiet /NoRestart
            }
          }

          # 自检：能真的跑通一段 VBScript 才算可用（light.exe 依赖的正是这个引擎）。
          $probe = Join-Path $env:RUNNER_TEMP 'vbscript_probe.vbs'
          Set-Content -Path $probe -Value 'WScript.Echo "vbscript-ok"' -Encoding Ascii
          $out = & "$env:SystemRoot\System32\cscript.exe" //nologo $probe 2>&1
          $code = $LASTEXITCODE
          Remove-Item $probe -Force -ErrorAction SilentlyContinue
          Write-Host "cscript probe exit=$code output=$out"
          if ($code -ne 0 -or "$out" -notmatch 'vbscript-ok') {
            Write-Warning 'VBScript engine still unavailable; MSI (light.exe) will likely fail.'
          }

      # Tauri 桌面构建；main.rs 的 env! 读上面的 KRONOS_* 环境变量。
      - name: Build Tauri app
        run: ${{ matrix.tauri-build-cmd }}
        shell: bash
        env:
          KRONOS_BACKEND_BUNDLE_MODE: lite
          KRONOS_WEB_SERVER: robyn
          # CI 环境无签名凭证，跳过 macOS 公证（仅打 ad-hoc 包）。
          # 注意：必须是 "-"（ad-hoc 签名，无需任何证书）；"" 会被当作真实 identity 名，
          # codesign 报 "no identity found" 导致 bundle 失败。
          APPLE_SIGNING_IDENTITY: "-"

      # 失败时把 WiX 中间产物留档：生成的 main.wxs 能直接看出是资源/组件渲染问题，
      # 还是环境问题（VBScript/ICE）。仅 Windows 产出 WiX 文件。
      - name: Upload WiX diagnostics on failure
        if: failure() && matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: Lumo-Windows-wix-diagnostics
          path: |
            src-tauri/target/release/wix/**/*.wxs
            src-tauri/target/release/wix/**/*.wxl
            src-tauri/target/release/wix/**/*.wixobj
          if-no-files-found: warn
          retention-days: 7

      - name: Collect artifacts
        if: always()
        run: |
          mkdir -p artifacts
          # 把 glob 命中的产物拷到 artifacts/ 顶层。
          bash -c 'cp -v ${{ matrix.artifact-glob }} artifacts/ 2>/dev/null || true'
          ls -la artifacts/ || true
        shell: bash

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Lumo-${{ matrix.artifact-name }}-${{ env.PACKAGE_KIND }}
          path: artifacts/*
          if-no-files-found: warn
          retention-days: ${{ env.ARTIFACT_RETENTION }}

  # 仅在 push v* tag 时运行：把三平台安装包附到 GitHub Release。
  # 测试包（非 main 分支）不会进入这里，只留在 Actions Artifacts。
  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Show collected files
        run: ls -la dist

      # 只附文件：.app 是目录（Release 不接受），其内容已包含在 .dmg 里。
      # fail_on_unmatched_files 保持默认 false —— 某个平台没产出该格式不应让发布失败。
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          draft: false
          prerelease: false
          files: |
            dist/*.dmg
            dist/*.exe
            dist/*.msi
            dist/*.deb
            dist/*.AppImage
            dist/*.rpm
