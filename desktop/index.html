<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Kronos Ultra</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
          "Microsoft YaHei", sans-serif;
        background: #f5f7fb;
        color: #18202f;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
      }

      main {
        width: min(520px, calc(100vw - 48px));
        display: grid;
        gap: 18px;
        text-align: center;
      }

      .brand {
        display: grid;
        gap: 8px;
      }

      h1 {
        margin: 0;
        font-size: 28px;
        font-weight: 700;
      }

      p {
        margin: 0;
        color: #526071;
        line-height: 1.7;
      }

      .loader {
        width: 42px;
        height: 42px;
        margin: 10px auto 0;
        border: 4px solid #d9e1ee;
        border-top-color: #007aff;
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }

      .status {
        min-height: 24px;
        font-size: 14px;
        color: #6a7688;
      }

      .actions {
        display: flex;
        justify-content: center;
      }

      button {
        border: 1px solid #c8d2df;
        border-radius: 6px;
        padding: 9px 14px;
        background: #fff;
        color: #18202f;
        font: inherit;
        cursor: pointer;
      }

      button:hover {
        border-color: #007aff;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          background: #11151d;
          color: #f5f7fb;
        }

        p,
        .status {
          color: #aab4c3;
        }

        .loader {
          border-color: #2d3848;
          border-top-color: #4da3ff;
        }

        button {
          background: #192131;
          border-color: #344155;
          color: #f5f7fb;
        }
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <main>
      <section class="brand">
        <h1>Kronos Ultra</h1>
        <p>正在启动本地分析服务，窗口会自动进入桌面版控制台。</p>
      </section>
      <div class="loader" aria-hidden="true"></div>
      <p id="status" class="status">正在准备工作台...</p>
      <div class="actions">
        <button id="retry" type="button">重新连接</button>
      </div>
    </main>

    <script>
      const target = "http://127.0.0.1:7070/desktop/overview";
      const status = document.getElementById("status");
      const retry = document.getElementById("retry");
      let attempts = 0;
      let timer = null;

      async function probe() {
        attempts += 1;
        status.textContent = `正在准备工作台... 第 ${attempts} 次`;

        try {
          const response = await fetch(target, { cache: "no-store" });
          if (response.ok) {
            status.textContent = "服务已就绪，正在打开控制台...";
            window.location.replace(target);
            return;
          }
        } catch (error) {
          if (attempts >= 8) {
            status.textContent = "工作台暂未就绪，请稍后重试。";
          }
        }

        timer = window.setTimeout(probe, 1000);
      }

      retry.addEventListener("click", () => {
        if (timer) {
          window.clearTimeout(timer);
        }
        attempts = 0;
        probe();
      });

      probe();
    </script>
  </body>
</html>
